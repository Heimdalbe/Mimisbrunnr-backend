services:
  database:
    image: mariadb:11.4
    ports:
      - "127.0.0.1:33306:3306"
    environment:
      MARIADB_DATABASE: mimisbrunnr_local
      MARIADB_USER: mimis_local
      MARIADB_PASSWORD: LocalOnly-Mimis-2026
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - local_database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  local_database:
